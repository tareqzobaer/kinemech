// ============================================================================
const TAU = Math.PI * 2;
const DEFAULT_EXPLODE = 0.4;
const wrap = (a) => (a % TAU + TAU) % TAU;
const deg = (r) => wrap(r) * 180 / Math.PI;
const fmt = (x, d = 3) => x == null || !isFinite(x) ? "\u2014" : x.toFixed(d);
const letterName = (i) => {
  let n = i + 1, s = "";

    const r = (n - 1) % 26;

};
const SUB_DIGITS = "\u2080\u2081\u2082\u2083\u2084\u2085\u2086\u2087\u2088\u2089";
const subscript = (n) => String(n).split("").map((c) => SUB_DIGITS[+c] ?? c).join("");
const unsubscript = (s) => String(s).split("").map((c) => {
  const i = SUB_DIGITS.indexOf(c);
  return i >= 0 ? String(i) : c;
}).join("");
const POI_LETTERS = ["X", "Y", "Z", "M", "N", "P", "Q", "R", "S", "T", "W"];
const poiLetterName = (i) => {
  const base = POI_LETTERS[i % POI_LETTERS.length], cycle = Math.floor(i / POI_LETTERS.length);
  return cycle === 0 ? base : `${base}${subscript(cycle + 1)}`;
};
function findLoop(joints, links) {
  if (joints.length < 3 || links.length !== joints.length) return null;
  if (links.some((lk) => lk.joints.length !== 2)) return null;
  const adj = new Map();
  joints.forEach((j) => adj.set(j.id, []));
  for (const lk of links) {
    const [j1, j2] = lk.joints;
    if (!adj.has(j1) || !adj.has(j2)) return null;
    adj.get(j1).push({ to: j2, link: lk.id });
    adj.get(j2).push({ to: j1, link: lk.id });
  }
  for (const j of joints) if (adj.get(j.id).length !== 2) return null;
  const start = joints[0].id;
  const order = [start];
  const used = new Set();
  let prevLink = null, cur = start;
  for (let step = 0; step < joints.length; step++) {
    const nbrs = adj.get(cur);
    const next = nbrs.find((n) => n.link !== prevLink && !used.has(n.link));
    if (!next) break;
    used.add(next.link);
    prevLink = next.link;
    cur = next.to;
    if (cur === start) {
      if (order.length === joints.length) return order;
      break;

    order.push(cur);

}
function findPOIJoints(joints, links) {
  const linkCount = new Map(joints.map((j) => [j.id, 0]));
  links.forEach((lk) => lk.joints.forEach((id) => linkCount.set(id, (linkCount.get(id) || 0) + 1)));
  const groundedIds = new Set(joints.filter((j) => j.ground).map((j) => j.id));
  const poiInfo = [];
  for (const lk of links) {
    if (lk.joints.length <= 2) continue;
    const pendant = lk.joints.filter((id) => !groundedIds.has(id) && linkCount.get(id) === 1);
    const core = lk.joints.filter((id) => !pendant.includes(id));
    if (pendant.length === 0 || core.length !== 2) continue;
    pendant.forEach((id) => poiInfo.push({ id, link: lk.id, ref: core[0] }));
  }

}
function findLoopWithPOI(joints, links) {
  const poiInfo = findPOIJoints(joints, links);
  const poiIds = new Set(poiInfo.map((p) => p.id));
  const coreLinks = links.map((lk) => poiIds.size && lk.joints.some((id) => poiIds.has(id)) ? { ...lk, joints: lk.joints.filter((id) => !poiIds.has(id)) } : lk);

function slotLine(j, links) {
  const lk = links.find((l) => l.id === j.slotLink);
  if (!lk || lk.joints.length < 2) return null;
  const anchorId = lk.joints.includes(j.slotAnchor) ? j.slotAnchor : lk.joints[0];
  let dirId = lk.joints.includes(j.slotDir) ? j.slotDir : lk.joints[1];
  if (dirId === anchorId) dirId = lk.joints.find((id) => id !== anchorId);
  return dirId ? { anchorId, dirId, link: lk } : null;
}
function slotLockCarrier(j, links) {
  return links.find((l) => l.id !== j.slotLink && l.joints.includes(j.id) && l.joints.length >= 2 && (!j.slotLockTo || l.id === j.slotLockTo));

function buildRefParents(joints, links) {
  const jmap = new Map(joints.map((j) => [j.id, j]));
  const adj = new Map(joints.map((j) => [j.id, []]));
  const addEdge = (a, b, info) => {
    if (adj.has(a)) adj.get(a).push({ to: b, ...info });
    if (adj.has(b)) adj.get(b).push({ to: a, ...info });
  };
  for (const lk of links) {
    const ids = lk.joints.filter((id) => jmap.has(id));
    for (let i = 1; i < ids.length; i++) addEdge(ids[0], ids[i], { kind: "link", link: lk.id });
    for (let i = 1; i < ids.length - 1; i++) addEdge(ids[i], ids[i + 1], { kind: "link", link: lk.id });
  }
  for (const j of joints) {
    if (j.type === "slider" && !j.ground && j.slotLink) {
      const sl = slotLine(j, links);
      if (sl && jmap.has(sl.anchorId)) addEdge(j.id, sl.anchorId, { kind: "slot", link: sl.link.id });
    }
  }
  const fixedSources = joints.filter((j) => j.ground && j.type !== "slider").map((j) => j.id);

  while (queue.length) {
    const cur = queue.shift();
    for (const e of adj.get(cur) || []) {
      if (visited.has(e.to)) continue;
      visited.add(e.to);
      parent[e.to] = { id: cur, kind: e.kind, link: e.link };
      queue.push(e.to);

    if (j.type !== "slider" || j.ground || !j.slotLink) continue;
    const sl = slotLine(j, links);
    if (!sl || !visited.has(sl.anchorId)) continue;
    let cyclic = false;
    for (let p = parent[sl.anchorId]; p; p = parent[p.id]) if (p.id === j.id) {

//  GENERAL PLANAR CONSTRAINT SOLVER

function solveLinear(A, b) {
  const n = b.length;
  if (n === 0) return [];
  const M = A.map((row, i) => row.slice().concat(b[i]));
  for (let col = 0; col < n; col++) {
    let piv = col;
    for (let r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
    if (Math.abs(M[piv][col]) < 1e-12) return null;

    M[col] = M[piv];
    M[piv] = tmp;
    const d = M[col][col];
    for (let c = col; c <= n; c++) M[col][c] /= d;
    for (let r = 0; r < n; r++) {
      if (r === col) continue;
      const f = M[r][col];
      if (f === 0) continue;
