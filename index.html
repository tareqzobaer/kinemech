  function cognateFrame(O2, O4, A, B, P3, kappa) {
    const O6 = vadd(O2, cmul(kappa, vsub(O4, O2)));
    const D = vadd(O2, vsub(P3, A));
    const D2 = vadd(O2, cmul(kappa, vsub(B, O2)));
    const E = vadd(A, cmul(kappa, vsub(O4, A)));
    const F = vadd(O4, cmul(vsub(kappa, { x: 1, y: 0 }), vsub(B, A)));
    return { O6, D, D2, E, F };
  }
  function cognateLengths(a, b, c, d, kappa) {
    const k = vlen(kappa);
    const k1 = vlen({ x: kappa.x - 1, y: kappa.y });
    return {
      cog2: { crank: b * k, coupler: k * a, rocker: k * c, ground: k * d },
      cog3: { crank: k1 * a, coupler: k1 * c, rocker: k1 * b, ground: k1 * d }
    };
  }
